# Lab 25B — Game Day config.
# The `client:` section is YOURS to tune (and justify in the report).
# Everything else describes the world; the grader uses its own copy.

seed: 25

workload:
  turns_per_s: 4.0        # user turns arriving per second (Poisson)
  turn_deadline_s: 30     # the user leaves after 30 s
  tool_exec_s: 0.3        # executing the tool between the two LLM calls
  steps: [tool, chat]     # step 1 needs tool calling, step 2 is plain chat
  base_malformed_rate: 0.0

# Four deployments. alpha and alpha-eu run the SAME model (family A-large).
providers:
  - {name: alpha,      family: A-large, region: us, supports_tools: true,  cost_per_call: 1.0,
     servers: 18, service_median_s: 1.2, max_queue_wait_s: 10, rate_limit_rps: 20}
  - {name: alpha-eu,   family: A-large, region: eu, supports_tools: true,  cost_per_call: 1.0,
     servers: 16, service_median_s: 1.5, max_queue_wait_s: 10, rate_limit_rps: 10}
  - {name: beta,       family: B-large, region: us, supports_tools: true,  cost_per_call: 1.4,
     servers: 30, service_median_s: 1.8, max_queue_wait_s: 10, rate_limit_rps: 16}
  - {name: gamma-mini, family: C-mini,  region: us, supports_tools: false, cost_per_call: 0.2,
     servers: 40, service_median_s: 0.6, max_queue_wait_s: 10, rate_limit_rps: 30}

fallback_order: [alpha, alpha-eu, beta, gamma-mini]

# ----------------------------------------------------------------------------
# YOUR client settings (read by ResilientClient). Tune them, explain them.
# ----------------------------------------------------------------------------
client:
  attempt_timeout_s: 8.0            # > beta p99 under load; leaves time for 2+ failovers in 30 s (30 s fails G6)
  max_attempts_per_provider: 2      # 1 retry on the same provider for 529/503/500, then fail over
  min_time_left_s: 1.0              # don't start an attempt that cannot finish
  retry_on_timeout: false           # a timeout already cost 8 s: fail over instead of waiting on the same queue
  rate_limit_jitter_s: 0.5          # spread calls waiting for a 429 cooldown over the next 1 s window
  reserve_tool_capacity: true       # last tool-capable provider left -> chat goes to gamma-mini (G6 429s 178 -> 8)
  slow_fallback: true               # all providers refused only for SLOWNESS -> send anyway (all +4 s: 0.71 -> 1.0)
  backoff_base_s: 0.25
  backoff_cap_s: 4.0
  retry_budget_ratio: 0.1           # retries <= ~10% of first attempts
  retry_budget_min_per_s: 0.5
  retry_budget_max_tokens: 20
  quota_cooldown_s: 300             # quota is billing: re-probing every 30 s only adds 429s (G5: 2 -> 21)
  breaker:
    window_size: 10                 # 8 calls/s: 10 results ~ 1.3 s of traffic (G2 p95 9.9 -> 8.1 s)
    min_calls: 5
    failure_rate_threshold: 0.5
    slow_call_s: 5.0                # normal p99 <= 4.1 s (beta); G4 adds 5 s. 8 s misses G4 (p95 13.8 s)
    slow_rate_threshold: 0.6
    open_duration_s: 10.0           # short: traffic is back on alpha well inside restore + 60 s
    half_open_max_probes: 2
    half_open_successes: 2
    # unhealthy_rate_threshold (failed or slow) defaults to max(failure, slow) thresholds = 0.6

# ----------------------------------------------------------------------------
# Part G: YOUR semantic cache settings (read by SemanticCache).
# These starter values are deliberately naive: run `make cache`, read
# wrong_answers_by_reason, tune each value and justify it in report section 8.
# ----------------------------------------------------------------------------
cache:
  similarity_threshold: 0.92   # paraphrases >= 0.951, different intents <= 0.862 (measured on the catalog)
  ttl_s: 60                    # bounds answers served after a SILENT doc change (outdated <= 5 on 5 seeds)
  max_stale_s: 600             # stale-if-error must outlast an outage (C1: 120 s) plus the TTL
  max_entries: 500
